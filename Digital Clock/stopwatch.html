<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StopWatch</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bitcount+Grid+Double:wght@100..900&display=swap"
        rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Honk:MORF@15&display=swap" rel="stylesheet">
</head>

<body>
    <div class="navPage">
        <a href="index.html">Clock</a>
        <a href="stopwatch.html">StopWatch</a>
    </div>
    <h1 style="color: #FFF8F0;" class="SW">STOPWATCH</h1>
    <div class="row">
        <div class="stopwatch">
            <div class="display">
                <h1 id="display">00:00:00:00</h1>
            </div>
            <div class="btn">
                <button class="timerButton" id="button1">START</button>
                <button class="timerButton" id="button2">STOP</button>
                <button class="timerButton" id="button3">RESET</button>
            </div>
        </div>
    </div>
    <script src="stopwatch.js" defer></script>
</body>
